# Лимит Travelpayouts для prices_for_dates: 600 запросов/мин.
# Держим запас 15% -> не больше 510 запросов/мин.
rate_limit_per_minute: 600
rate_safety_margin: 0.15
# Пауза между циклами: число секунд (600 = раз в 10 минут) или auto = максимально часто в рамках лимита
poll_interval_seconds: 600
currency: rub
market: ru
# Повторно уведомлять о том же билете, только если цена упала минимум на столько %
realert_drop_percent: 5

searches:
  # Вьетнам -> Москва / СПб
  - origins:
      - {code: DAD, name: Дананг, priority: true}
      - {code: NHA, name: Нячанг}
      - {code: SGN, name: Хошимин}
      - {code: HAN, name: Ханой}
    destinations:
      - {code: MOW, name: Москва}
      - {code: LED, name: Санкт-Петербург}
    dates: {from: 2026-10-29, to: 2026-10-31}
    max_price: 35000
    max_transfers: 2   # 0/1/2, чем меньше - тем выше в выдаче
    one_way: true

  # Вьетнам -> Новосибирск: только прямые и до 20000
  - origins:
      - {code: DAD, name: Дананг, priority: true}
      - {code: NHA, name: Нячанг}
      - {code: SGN, name: Хошимин}
      - {code: HAN, name: Ханой}
    destinations:
      - {code: OVB, name: Новосибирск}
    dates: {from: 2026-10-29, to: 2026-10-31}
    max_price: 20000
    max_transfers: 0
    one_way: true
